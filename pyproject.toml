[project]
name = "agentic-ai-portfolio"
version = "0.1.0"
description = "Portfolio monorepo of LangGraph/LangChain business agents (offline-first, mock LLM by default)."
authors = [{ name = "Jagadish Meduri" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.12,<2",
    "langchain-core>=1.6.5,<2",
    "pydantic>=2.13.5,<3",
    "langchain>=1.4.2,<2",
    "mcp>=1.30.0",
    "langchain-mcp-adapters>=0.3.2",
    "opentelemetry-sdk>=1.45.0",
    "pyyaml>=6.0.3",
    "fastapi>=0.115",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.6.6,<2"]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.45.0,<2"]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.16.9,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["shared", "projects"]
# Project folders have hyphens (e.g. 03-refund-agent), so each project's
# importable package lives one level down and is put on the path here.
pythonpath = [".", "projects/03-refund-agent", "projects/10-supply-chain-multi-agent", "projects/01-policy-qa-rag", "projects/02-ticket-triage", "projects/04-sales-meeting-prep", "projects/05-invoice-po-matching", "projects/06-incident-investigator", "projects/07-rfp-response", "projects/08-contract-review", "projects/09-collections-agent", "projects/11-customer-care-e2e", "projects/12-agent-control-plane", "projects/13-insurance-fnol-coverage", "projects/14-healthcare-prior-auth"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["shared", "refund_agent", "supply_chain", "policy_qa", "ticket_triage", "meeting_prep", "invoice_match", "incident_agent", "rfp_agent", "contract_review", "collections_agent", "care_e2e", "control_plane", "fnol", "prior_auth"]
