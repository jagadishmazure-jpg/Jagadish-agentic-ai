name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (locked)
        run: uv sync --locked --all-extras --group dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Pytest (offline, mock LLM)
        env:
          LLM_PROVIDER: mock
        run: uv run pytest
      - name: Eval gate - all projects (golden sets, thresholds from doctrine.yaml)
        env:
          LLM_PROVIDER: mock
        run: uv run python -m evals --no-write
      - name: Eval gate - contract review precision/recall
        env:
          LLM_PROVIDER: mock
        run: uv run python projects/08-contract-review/evals/run_eval.py --min-precision 0.8 --min-recall 0.8
      - name: Doctrine promotion gate (cards complete, five-exit coverage, scores, DOCTRINE.md fresh)
        env:
          LLM_PROVIDER: mock
        run: uv run python -m shared.doctrine validate

  docs:
    # Pasted command output and code excerpts in every Markdown file must match the code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.13"
      - name: Install dependencies (locked)
        run: uv sync --locked --all-extras --group dev
      - name: Doc drift check (scripts/render_docs.py --check)
        env:
          LLM_PROVIDER: mock
        run: uv run python scripts/render_docs.py --check

  secrets:
    # gitleaks over the full git history. Known false positives (public role IDs, synthetic
    # attack fixtures) are listed by fingerprint in .gitleaksignore.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
