project: 12-agent-control-plane
title: Agent control plane - registry, A2A contract and who-may-call-whom policy
owner: Jagadish Meduri
industry: Cross-industry platform (B2B manufacturing / distribution demo)
summary: >-
  A governed agent mesh. Every agent registers a card (purpose, skills with side-effect class,
  tools, models, budgets, owner, allowed callers, tenants, eval scores) and must be promoted
  through an eval-score gate before anyone can call it. Agents talk over an A2A-shaped task
  contract (agent card at /.well-known/agent.json, JSON-RPC message/send) that carries the
  tenant, the calling agent and a W3C traceparent. The control plane checks every task at the
  callee: registration, kill switch, stage, tenant, allowed callers, per-tenant skill policy,
  schema and budget. The demo journey agent asks CRM, SAP-like and Databricks-like demand
  agents in parallel whether an order can be promised, and drafts a PO on a shortfall.
maturity:
  level: 4
  rationale: multi-agent with enforced contracts - registry, promotion gate, per-tenant policy, kill switch, budgets and end-to-end tracing across agents; the one write is a reversible PO draft
  next_rung: back the registry with a store and signed agent cards (Entra agent identities), push policy to APIM so it is enforced at the edge as well, and feed eval scores from CI automatically
kpis:
  - {name: Unregistered or unauthorised A2A calls served, target: "0", measure: "audit log: allow decisions without a matching registry record + rule"}
  - {name: Kill-switch time to effect, target: "next task (no redeploy)", measure: "kill event -> first rejected task timestamp"}
  - {name: Agents in prod below their promotion bar, target: "0", measure: "registry scan of stage=prod vs PROMOTION_BARS"}
  - {name: Cross-agent trace completeness, target: ">= 99% of A2A tasks share the caller trace id", measure: "a2a.server spans with a parent from the caller"}
roi: >-
  The value is avoided risk and faster reuse rather than a single workflow saving. Teams can
  call each other's agents without bespoke integration because the contract and the policy are
  shared. Security and risk reviews approve one control plane instead of every pair of agents.
  A bad release can be switched off in seconds without a redeploy, and every cross-agent
  answer can be traced end to end. Costs are the platform team and a registry/policy store.
planes:
  experience: registry admin API (FastAPI; platform-admin token stub) and each peer's A2A endpoint mounted under /agents/<name>; account managers use the journey agent from their CRM
  agent: LangGraph journey agent (intake -> discover -> [crm || sap || demand] -> decide -> draft_po -> respond) calling peer agents over A2A; peers are thin skills over their own MCP gateways
  knowledge: none - the journey answers from live system data only; agent cards are the discovery metadata
  data: CRM, ERP (SAP-like stock, open POs, PO drafts) and a Databricks-like analytics measure via MCP servers, each behind the owning agent's gateway identity
systems_of_record:
  - {name: CRM, kind: mcp, contract: "crm.get_account (read) - via crm-agent only", access: read}
  - {name: ERP (SAP-like), kind: mcp, contract: "erp.get_stock, erp.get_open_purchase_orders (read); erp.create_po_draft (write, idempotent) - via sap-agent only", access: read_write}
  - {name: Lakehouse gold (Databricks-like), kind: semantic_model, contract: "analytics.get_measure(weekly_units, sku) - via demand-agent only", access: read}
  - {name: Agent registry, kind: api, contract: "GET/POST /registry/agents, /promote, /kill, /revive, /audit", access: read_write}
knowledge:
  corpora: []
  notes: No retrieval corpus by design - every number in the answer comes from a peer agent's system-of-record read, and the journey's reply is checked against the deterministic ATP.
contracts:
  mcp:
    - "crm.get_account(account_id) -> {customer_id, tenant, credit_hold, notes}"
    - "erp.get_stock(sku) / erp.get_open_purchase_orders(sku)"
    - "erp.create_po_draft(po, idempotency_key, dry_run)"
    - "analytics.get_measure(measure, entity, grain)"
  a2a:
    - "crm-agent.get_customer_360 {customer_id} -> customer_360 (read_only)"
    - "sap-agent.get_stock {sku} -> stock (read_only)"
    - "sap-agent.create_po_draft {sku, qty, reason, idempotency_key} -> po_draft (reversible_write; tenant northwind only)"
    - "demand-agent.forecast {sku, weeks} -> forecast (read_only; project 10 forecasting logic)"
  notes: "A2A-shaped JSON-RPC (message/send, tasks/get) with agent card at /.well-known/agent.json; headers x-tenant-id, x-caller-agent, traceparent. Error codes: -32602 schema, -32010 policy, -32011 kill switch, -32012 budget, -32004 unavailable."
identities:
  - {identity: mi-crm-agent, allow: [crm.get_account]}
  - {identity: mi-sap-agent, allow: [erp.get_stock, erp.get_open_purchase_orders, erp.create_po_draft]}
  - {identity: mi-demand-agent, allow: [analytics.get_measure]}
  - {identity: journey-agent (A2A caller), allow: ["crm-agent.get_customer_360", "sap-agent.get_stock", "sap-agent.create_po_draft (northwind)", "demand-agent.forecast"]}
stop_conditions:
  - every A2A task is authorised at the callee; the first failed check rejects it with a coded error and an audit record
  - killed or unpromoted peers are skipped at discovery; missing inputs mean "cannot confirm", never a promise
  - credit hold or customer not visible in the tenant -> escalate to a human, no promise
  - at most one PO draft per thread and SKU (idempotency key po:<thread>:<sku>); drafts only, a buyer releases
  - per caller+tenant call budget on each peer (-32012 when exhausted)
graph: control_plane.journey:build_graph
failure_playbook:
  - node: intake
    success: model parses customer, SKU, qty and horizon
    retry: fallback deployment
    compensate: n/a (read-only)
    degrade: models down or bad JSON -> regex parser
    escalate: request not understood -> ask for the standard phrasing
  - node: discover
    success: all three peers registered, enabled and in prod
    retry: n/a
    compensate: n/a
    degrade: killed / unpromoted peer skipped; its data reported as unavailable
    escalate: n/a
  - node: crm
    success: customer 360 from crm-agent in the caller's tenant
    retry: peer gateway backoff inside crm-agent
    compensate: n/a (read-only)
    degrade: peer unreachable or its CRM down -> no customer data, no promise; injected note text arrives neutralised
    escalate: control-plane rejection (policy, budget) -> reason surfaced
  - node: sap
    success: on hand, safety stock and open PO quantity from sap-agent
    retry: peer gateway backoff inside sap-agent
    compensate: n/a (read-only)
    degrade: peer unreachable or ERP down -> stock unavailable, no promise
    escalate: control-plane rejection -> reason surfaced
  - node: demand
    success: forecast over the horizon from demand-agent (project 10 logic)
    retry: peer gateway backoff inside demand-agent
    compensate: n/a (read-only)
    degrade: peer unreachable -> forecast unavailable, no promise
    escalate: control-plane rejection (e.g. policy rule removed) -> reason surfaced
  - node: decide
    success: deterministic ATP = on hand + open POs - forecast - safety stock
    retry: n/a
    compensate: n/a
    degrade: any input missing -> "cannot confirm", planner follow-up
    escalate: credit hold or customer not in tenant -> human (finance / account owner)
  - node: draft_po
    success: PO draft for the shortfall rounded up to 50, via sap-agent, idempotent
    retry: A2A replay with the same idempotency key is safe
    compensate: "erp.cancel_po_draft (draft only, nothing released)"
    degrade: sap-agent unreachable -> reply says a buyer must raise the PO
    escalate: policy denies drafts in this tenant -> buyer raises the PO
  - node: respond
    success: model wording whose numbers match the decision
    retry: fallback deployment
    compensate: n/a
    degrade: models down or numbers mismatch -> template reply
    escalate: n/a
chaos:
  - {fault: model, node: intake, exit: degrade, invariant: "regex intake + template reply; same promise with ATP 360"}
  - {fault: "a2a:sap-agent", node: sap, exit: degrade, invariant: "stock unavailable -> cannot confirm; never says YES"}
  - {fault: "sor:crm", node: crm, exit: degrade, invariant: "crm-agent's system down -> no customer data -> cannot confirm; no PO drafted"}
  - {fault: jailbreak, node: crm, exit: degrade, invariant: "instruction planted in CRM notes neutralised by crm-agent's sanitizer; promise still computed from data"}
eval:
  golden: evals/golden.jsonl
  suite: control_plane.eval_suite:run_case
  thresholds:
    task_success: ">=0.95"
    policy_violation_rate: "<=0"
    cost_per_task: "<=0.002"
