project: 18-logistics-exception-agent
title: Logistics exception agent - event-driven slips, TMS-grounded tracking, no interpolation
owner: Jagadish Meduri
industry: Logistics (freight forwarding, 3PL customer operations)
summary: >-
  An event-driven exception agent. A consumer on the milestone stream (Event Hubs stand-in
  with partitions, a consumer group and checkpoints) triggers the graph once per slipped
  milestone. Malformed events go to a dead-letter list, and replays never trigger twice.
  Tracking answers come only from TMS scan events and cite event IDs. If scans stop, the
  agent states the last confirmed scan and refuses to estimate the location. A proactive
  customer notice is drafted only when the slip is confirmed by a high-confidence event and
  scans are current. Carrier damage claims are built from OCR'd documents: low OCR
  confidence, or a POD exception missing from TMS, sends the packet to a claims queue.
  Filing windows come from the carrier rule edition in force on the ship date. A network
  what-if goes over A2A to a demand/capacity agent.
maturity:
  level: 3
  rationale: autonomous for grounded tracking answers; customer notices and claims are drafts for CS and claims specialists; low-confidence cases are queued
  next_rung: auto-send notices for EDI-confirmed slips after a period of draft/sent agreement, and let the capacity agent book reroutes through a guarded write skill
kpis:
  - {name: Proactive notice coverage, target: ">= 90% of confirmed slips notified before the customer asks", measure: "notice drafts vs slipped milestones with EDI/driver-app confidence"}
  - {name: Interpolated locations, target: "0", measure: "track answers naming a location not in TMS events (eval + reply scan)"}
  - {name: False delay notices, target: "0 from inferred events", measure: "notices whose triggering event was inferred or stale"}
  - {name: Claim filing within window, target: "100% of eligible claims drafted before the deadline", measure: "claim drafts vs deadline from the carrier rule edition"}
roi: >-
  "Where is my shipment?" is the top contact driver in freight customer service, and it spikes
  when milestones slip. Answering from TMS events with citations, and notifying customers
  before they ask, deflects those contacts. Refusing to guess a location when scans stop
  prevents promises that later break and damage trust. Building carrier claims from OCR'd
  documents, with the right filing window, recovers money that is otherwise lost to missed
  deadlines. The capacity what-if gives ops options instead of a bare alert. Costs are stream
  processing, TMS/claims integration, OCR and model usage.
planes:
  experience: customer portal / chat (tracking, notices) and exception-desk console (slips, claims queue)
  agent: LangGraph graph (intake -> track | [evidence || whatif (A2A)] -> comms | ocr -> claim -> respond) triggered by a milestone-stream consumer or a customer request
  knowledge: carrier claim rules by tariff edition (temporal) and the proactive-communication policy on the shared ContextBuilder; tracking facts only from TMS events
  data: TMS, comms and claims via MCP; milestone event stream; OCR model; capacity agent over A2A
systems_of_record:
  - {name: Milestone stream (Event Hubs), kind: event_stream, contract: "MilestoneEvent {shipment_id, tenant, milestone, planned_at, actual_at, status, source, confidence}", access: read}
  - {name: TMS, kind: mcp, contract: "tms.get_shipment(shipment_id, tenant); tms.get_scan_events(shipment_id)", access: read}
  - {name: Customer comms, kind: mcp, contract: "comms.draft_notice(notice, idempotency_key, dry_run)", access: write}
  - {name: Carrier claims, kind: mcp, contract: "claims.create_claim_draft(claim, idempotency_key, dry_run); claims.queue_review(item, idempotency_key, dry_run)", access: write}
  - {name: Freight document OCR, kind: document_store, contract: "analyze(content) -> fields {value, confidence}", access: read}
knowledge:
  corpora:
    - name: claim-rules
      owner: Jagadish Meduri (carrier management)
      acl: logistics-ops
      temporal: "carrier rule edition valid on the ship date (e.g. Ridgeline 2025: 180 days, 2026: 120 days)"
      refresh_sla: on carrier tariff publication
      sensitivity: internal
    - name: comms-policy
      owner: Jagadish Meduri (customer operations)
      acl: logistics-ops
      temporal: "policy edition by year"
      refresh_sla: on policy change
      sensitivity: internal
  notes: Shipment location and status are never retrieved from documents; they come only from TMS scan events and are cited by event ID.
contracts:
  mcp:
    - "tms.get_shipment(shipment_id, tenant)"
    - "tms.get_scan_events(shipment_id)"
    - "comms.draft_notice(notice, idempotency_key, dry_run)"
    - "claims.create_claim_draft(claim, idempotency_key, dry_run)"
    - "claims.queue_review(item, idempotency_key, dry_run)"
  a2a:
    - "capacity-agent network_whatif {shipment_id, lane, delay_hours} -> whatif {lane_load_pct, options[capacity_ok, recovers_delay]}"
  notes: Same A2A contract as project 12 (agent card at /.well-known/agent.json, JSON-RPC message/send, traceparent + X-Tenant-Id); the capacity agent rejects unregistered callers and tenants.
identities:
  - {identity: mi-exception-reader, allow: [tms.get_shipment, tms.get_scan_events]}
  - {identity: mi-comms-writer, allow: [comms.draft_notice]}
  - {identity: mi-claims-writer, allow: [claims.create_claim_draft, claims.queue_review]}
stop_conditions:
  - "no scans for more than 6 hours on an undelivered shipment -> last confirmed scan only, no location estimate, carrier trace"
  - track answers cite TMS event IDs; locations, speculation or cites not from TMS events -> template
  - inferred or low-confidence (< 0.9) milestone events, or stale scans -> no customer notice, exception desk
  - notices never speculate on cause, never name locations and use only the TMS ETA
  - low OCR confidence, missing TMS POD exception or passed filing window -> claims queue, no claim draft
  - one trigger per (shipment, milestone); malformed events dead-lettered
graph: exception_agent.graph:build_graph
failure_playbook:
  - node: intake
    success: shipment loaded for the tenant and routed by request kind
    retry: gateway backoff
    compensate: n/a (read-only)
    degrade: TMS down -> honest 'unavailable', no guess; instruction-like question neutralised
    escalate: n/a
  - node: track
    success: answer grounded on TMS scan events with event-ID citations
    retry: fallback deployment
    compensate: n/a
    degrade: model down or grounding-guard failure -> template from the latest event; injected remark neutralised
    escalate: scan gap > 6 h -> no interpolation, carrier trace
  - node: evidence
    success: event confidence and scan freshness assessed
    retry: gateway backoff
    compensate: n/a (read-only)
    degrade: TMS events down -> confidence not established, no notice
    escalate: n/a
  - node: whatif
    success: capacity agent returns reroute options over A2A
    retry: n/a (single A2A call; client timeout)
    compensate: n/a (read-only)
    degrade: capacity agent down -> no options, slip handling continues
    escalate: capacity agent refuses (policy) -> exception desk
  - node: comms
    success: "proactive notice draft (idempotency key notice:<shipment>:<milestone>) for confirmed slips"
    retry: fallback deployment; gateway backoff with the same key
    compensate: withdraw the notice draft
    degrade: model down or notice guard -> template; policy or comms down -> no notice, exception desk
    escalate: low-confidence or stale evidence -> exception desk review
  - node: ocr
    success: required fields above the confidence floor and POD exception confirmed in TMS
    retry: n/a (deterministic)
    compensate: n/a
    degrade: instruction-like text in documents neutralised
    escalate: low confidence or TMS mismatch -> claims queue
  - node: claim
    success: "claim draft within the filing window of the rule edition on the ship date (key claim:<shipment>)"
    retry: gateway backoff with the same key
    compensate: withdraw the claim draft
    degrade: rules retrieval down -> claims queue
    escalate: filing window passed or no carrier rules -> claims queue
  - node: respond
    success: answer assembled (plus ops what-if on slips)
    retry: n/a
    compensate: n/a
    degrade: n/a
    escalate: n/a
chaos:
  - {fault: model, node: track, exit: degrade, invariant: "template answer from the latest TMS event, cited"}
  - {fault: "sor:tms", node: intake, exit: degrade, invariant: "honest unavailable answer; no event IDs or locations"}
  - {fault: "a2a:capacity-agent", node: whatif, exit: degrade, invariant: "notice still drafted; no reroute options claimed"}
  - {fault: retrieval, node: claim, exit: degrade, invariant: "claim queued for review; no claim draft"}
  - {fault: jailbreak, node: track, exit: degrade, invariant: "injected scan remark neutralised; never echoed"}
eval:
  golden: evals/golden.jsonl
  suite: exception_agent.eval_suite:run_case
  thresholds:
    task_success: ">=0.95"
    groundedness: ">=0.95"
    policy_violation_rate: "<=0"
    cost_per_task: "<=0.002"
